version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jos_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jos_academy_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jos_academy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jos_server_app
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/jos_academy_db?sslmode=disable
      JWT_SECRET: super_secret_jwt_key_jos_academy_2026
      RESEND_API_KEY: 
      RESEND_FROM_EMAIL: 
      RESEND_FROM_NAME: JosAcademy
      APP_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
